
services:
  nodejs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-app
    restart: unless-stopped
    env_file:
       - .env.production
    command: 
        - npm
        - start
    ports:
      - "5000:5000"
    networks:
      - monitoring
      - backend
    logging:
      driver: json-file
      options:
        max-size: "150m"
        max-file: "3"
        compress: "true"
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    networks:
      - monitoring


  minio-init:
    image: minio/mc:latest
    container_name: minio-init

    depends_on:
      - minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/loki;
      exit 0;
      "

    networks:
      - monitoring


  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/loki-config.yaml"
      - "-config.expand-env"

    environment:
      LOKI_S3_ACCESS_KEY: ${LOKI_S3_ACCESS_KEY}
      LOKI_S3_SECRET_KEY: ${LOKI_S3_SECRET_KEY}

    ports:
      - "3100:3100"

    volumes:
      - ~/monitoring-config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

    depends_on:
      minio-init:
        condition: service_completed_successfully

    networks:
      - monitoring


  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy

    volumes:
      - ~/monitoring-config/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy

    depends_on:
      - loki

    networks:
      - monitoring


  prom-server:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    
    ports:
      - "9090:9090"

    volumes:
      - ~/monitoring-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    networks:
      - monitoring


  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - loki
      - prom-server

    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  backend: 
    external: true


volumes:
  minio-data:
  loki-data:
  prometheus-data:
  grafana-data:
  alloy-data:
